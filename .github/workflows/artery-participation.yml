name: artery-participation
# ═══════════════════════════════════════════════════════════════════════════
# ARTERY-PARTICIPATION · T-65 (zai-code-3) — ספר-ההשתתפות של הצי, שתי-שרשרות.
# ───────────────────────────────────────────────────────────────────────────
# הוראת-בעלים (2026-10-12): "כל החשבונות יהיו שותפים לפעילות... לא בטוח שכולם
# עושים שוק... תמצא פתרון להזרים את הhive". העורק מודד לכל-חשבון: רשויות-חיות
# (census-v2 + KEYS-ACCESS — מפתחות-ציבוריים בלבד), יתרות, SP/HP, RC%, פקודות,
# פעילות, ורכסות-השתתפות אמיתיות. אפס-סודות (APIs-ציבוריים בלבד).
# כל-שעה בדקה 13 · dispatch · tick דרך artery-watch. כנות-קודמת-לנוחות.
# ═══════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - participation-tick

permissions:
  contents: write

concurrency:
  group: artery-participation
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Measure the fleet participation book (zero secrets)
        env:
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: node engine/fleet-participation.mjs

      - name: public-surface audit (zero fleet names — refs law, fail-closed)
        if: always()
        run: |
          # דפוס-האיסור נבנה בזמן-ריצה מ-base64 (אפס-שמות-צי בעץ — אחרת-הסריקה-תחסום-את-עצמה);
          # wave-19.44 port: המנוע-המקומי היה-הגרסה-הקדם-refs (שמות-גולמיים בקוד+בקבלות) —
          # הכותב מרופא; השער-הזה הוא-הקו-האחרון.
          PAT=$(printf '%s' 'Y2FzaG1hY2hpbmV8aGNzb2xkaWVyfGlzcmFlbG5ld3N8bWFjcmFtZXxcYndvcVxifFxid29nXGJ8XGJ3aWNcYnxcYnNpcVxifFxibHNhXGJ8XGJoYXJhblxifFxidG92XGJ8Y29ybmVyc3RvbmV8aGVhZGNvcm5lcg==' | base64 -d)
          # חוק-הטריטוריה (הלקח-החי-של-verifier.yml): השער סורק-את-מה-העורק-הזה מפרסם.
          # סריקת-עץ-מלאה תעבור-כשכותבי-ה-python (DECIDER/VALUE-SCAN) יועברו-ל-refs (Next wave).
          HITS=$(grep -rEn "$PAT" receipts/fleet-participation engine/fleet-participation.mjs engine/refs.mjs 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | head -20
            echo "fleet-name leak in the public tree — blocked (refs law)"
            exit 1
          fi
          echo "public-surface audit: clean (zero fleet names)"

      - name: Commit receipts (FF-only with yield, honest on failure)
        if: always()
        run: |
          set -Eeuo pipefail
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add receipts/fleet-participation/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no receipt change — clean exit"
          else
            git commit -m "fleet-participation receipts: $(node -e "try{const r=require('./receipts/fleet-participation/latest.json');process.stdout.write(r.overall+' · '+r.reason.slice(0,110))}catch(e){process.stdout.write('receipt-read-fail')}") $(date -u +%FT%TZ) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break || { sleep $((i*5)); git rebase --abort 2>/dev/null || true; }
            done
            # S4 landing gate (2026-10-14): all-retries-failed used to drain into a silent green
            # (the verdict gate reads the LOCAL receipt). Final attempt must land or fail loud.
            git fetch origin main --quiet
            git rebase origin/main --quiet || { echo "::error::S4: rebase failed during landing gate"; exit 1; }
            git push origin HEAD:main || { echo "::error::S4: push did not land after retries — failing loud"; exit 1; }
          fi

      - name: Honest verdict gate
        if: always()
        run: |
          node -e "try{const r=require('./receipts/fleet-participation/latest.json');console.log('PARTICIPATION:',r.overall,'·',r.reason);(r.alerts||[]).forEach(a=>console.log('ALERT:',a));}catch(e){console.log('receipt unreadable — honest red');process.exit(1);}"
