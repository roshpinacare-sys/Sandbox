# STAGE-0 NETWORK PROBES — Hive + Blurt (task 9-d, expansion ladder)
#
# קריאה-בלבד. אפס-מפתחות. אפס-אימות. אפס-שידור.
# Read-only public chain probes: network status, price feeds, market tickers,
# node health. No secrets in this workflow by design — the digest IS the product.
#
# Per sovereign/EXPANSION-PLAN-2026-10-11.md Stage 0 (no keys):
#   · hive-probe.mjs  — Hive network status, internal market, witness feed.
#   · blurt-probe.mjs — multi-node Blurt health ladder (intel for R294;
#     advisory only — never touches blurt.mjs / blurt-arm.json ceremony).
#
# fail-open-honest: a failed probe still commits its digest (a red probe is a
# fact) and then exits non-zero so the job shows the truth. אף-פעם לא מזויף-הצלחה.
#
# Runs on free public minutes (this repo is public), zero sandbox dependency.

name: hive-probe

on:
  schedule:
    - cron: "41 5 * * *" # יומי 05:41 UTC — Stage-0 digest לסולם-ההרחבה
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hive-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Selftest first (mocked fetch — network-independent gate)
        run: |
          node probes/hive-probe.mjs --selftest
          node probes/blurt-probe.mjs --selftest

      - name: Run Stage-0 probes (read-only; honest exit codes preserved)
        run: |
          set +e
          node probes/hive-probe.mjs | tee /tmp/hive.out
          echo ${PIPESTATUS[0]} > /tmp/hive.exit
          node probes/blurt-probe.mjs | tee /tmp/blurt.out
          echo ${PIPESTATUS[0]} > /tmp/blurt.exit
          echo "hive exit=$(cat /tmp/hive.exit) blurt exit=$(cat /tmp/blurt.exit)"

      - name: Commit the digests (receipt = commit)
        run: |
          set -u
          git config user.name "probe-runner[bot]"
          git config user.email "probe-runner[bot]@users.noreply.github.com"
          git add probes/hive probes/blurt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no digest change — clean exit"
          else
            git commit -m "[probes] stage-0 network digests: hive+blurt $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Honest exit (red job = red probe, recorded in committed digest)
        run: |
          h=$(cat /tmp/hive.exit)
          b=$(cat /tmp/blurt.exit)
          echo "probe exits: hive=$h blurt=$b"
          test "$h" = "0" -a "$b" = "0"
