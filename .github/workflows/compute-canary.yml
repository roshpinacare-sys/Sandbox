name: compute-canary
# COMPUTE-CANARY - probe of the billing wall (T-REARM, agents/compute-policy.md)
# Measured 2026-10-13: exhausted private-repo Actions minutes flooded the owner
# with ~95 blocked-run emails (0-step startup failures). The estate parked 18
# private repos (Actions enabled=false) and armed Autonomy/compute-rearm.yml.
# This canary is the meter: one trivial runner step, cheap.
# Wall closed -> probe blocked -> honest silence between probes.
# Owner opens the ceiling -> canary goes green -> the network revives itself.
# canary cadence 24h — billing-wall probes emit failure emails ~1/day while
# compute wall is closed; widen further if storm resumes.
# t27 measured: repo-wide zero-step runner-acquisition failure — 31 consecutive across 4 workflows and 2 image versions (15.10–19.10), t22-b autopsy BlobNotFound; the Sandbox runner lane is dead at GitHub-infra level (not fixable from tree); the billing-wall openness it was built to meter is continuously proven by the fleet (hundreds of green runs/day org-wide). Passed to owner for GitHub-support-level revival.
# Measured 61-d: while walled, the live dispatch cadence is governed by
# Autonomy/agents/compute-park-ledger.json (cooldownHours widened 6->24 in the
# same wave); this schedule is the declared daily beat and keeps probing
# once/day after revival. workflow_dispatch kept for manual probes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compute-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: one trivial runner step proves the billing wall is open
        run: |
          echo "compute-canary runner alive $(date -u +%FT%TZ)"
