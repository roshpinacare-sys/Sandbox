name: pages-deploy
# פריסת-קונסולת-המפעיל ל-GitHub Pages — השער-המוצפן-קליינט-סייד.
# סטטי-לגמרי: אפס-שרת, אפס-מסד, אפס-סודות. הסיסמה-מעולם-לא-עוברת-על-החוט.
on:
  push:
    branches: [main]
    paths: ["console/**", "docs/**", "network/**", "receipts/**", "operator/**", "status/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-pages
        uses: actions/configure-pages@v5
      # EXTEND (T-37-cockpit, agent-2): console/ at site-root + docs/ cockpit at /cockpit/.
      # EXTEND (T-38-operator, agent-2): + unified operator portal at /operator/.
      # EXTEND (T-43, agent-3): + status/ public proof page at /status/.
      - name: assemble-site
        run: |
          mkdir -p _site/cockpit _site/network _site/receipts _site/operator _site/status
          cp -r console/. _site/
          cp -r docs/. _site/cockpit/
          cp -r network/. _site/network/
          # T-42 (agent-3): designed-public receipts only — the board reads them.
          for f in latest.json ticks.jsonl network.json network-log.jsonl; do
            [ -f "receipts/$f" ] && cp "receipts/$f" _site/receipts/
          done
          cp -r operator/. _site/operator/
          rm -rf _site/operator/server/.env.local
          cp -r status/. _site/status/
      - name: upload-site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
