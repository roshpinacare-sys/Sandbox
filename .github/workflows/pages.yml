name: pages-deploy
# פריסת-קונסולת-המפעיל ל-GitHub Pages — השער-המוצפן-קליינט-סייד.
# סטטי-לגמרי: אפס-שרת, אפס-מסד, אפס-סודות. הסיסמה-מעולם-לא-עוברת-על-החוט.
on:
  push:
    branches: [main]
    paths: ["console/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-pages
        uses: actions/configure-pages@v5
      # EXTEND (T-37-cockpit, agent-2): artifact now carries BOTH gates —
      # console/ at site-root (agent-1, unchanged) + docs/ cockpit at /cockpit/.
      - name: assemble-site
        run: |
          mkdir -p _site/cockpit
          cp -r console/. _site/
          cp -r docs/. _site/cockpit/
      - name: upload-site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
        id: deployment
        uses: actions/deploy-pages@v4
